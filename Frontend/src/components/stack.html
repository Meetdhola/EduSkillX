<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Visualization with Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
        }
        button {
            margin: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }
        input {
            margin: 5px;
            padding: 8px;
            width: 50px;
        }
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            color: white;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Stack Controls</h3>
        <div>
            <button id="push">Push</button>
            <input type="number" id="pushValue" placeholder="Value" value="0">
        </div>
        <div>
            <button id="pop">Pop</button>
        </div>
        <div>
            <button id="peek">Peek</button>
        </div>
        <div>
            <button id="reset">Clear Stack</button>
        </div>
    </div>
    <div id="info">
        <h3>Stack Information</h3>
        <div id="stackInfo">Empty Stack</div>
        <div id="operationInfo"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.161.0/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';

        // Stack class
        class Stack {
            constructor() {
                this.items = [];
                this.top = -1;
            }

            // Push element to the stack
            push(element) {
                this.top++;
                this.items[this.top] = element;
                return this.items.length;
            }

            // Remove and return the top element
            pop() {
                if (this.isEmpty()) {
                    return "Stack is empty";
                }
                this.top--;
                return this.items.pop();
            }

            // Return the top element without removing it
            peek() {
                if (this.isEmpty()) {
                    return "Stack is empty";
                }
                return this.items[this.top];
            }

            // Check if stack is empty
            isEmpty() {
                return this.top === -1;
            }

            // Return the size of stack
            size() {
                return this.top + 1;
            }

            // Clear the stack
            clear() {
                this.items = [];
                this.top = -1;
            }

            // Return stack as string
            toString() {
                if (this.isEmpty()) {
                    return "Empty Stack";
                }
                return this.items.join(", ");
            }
        }

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e2733);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;
        camera.position.y = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Orbit controls for camera
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Add a platform for the stack
        const platformGeometry = new THREE.BoxGeometry(6, 0.5, 3);
        const platformMaterial = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const platform = new THREE.Mesh(platformGeometry, platformMaterial);
        platform.position.y = -1;
        scene.add(platform);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);

        // Font loader
        const fontLoader = new FontLoader();
        let font;

        // Load font
        fontLoader.load('https://cdn.jsdelivr.net/npm/three@0.161.0/examples/fonts/helvetiker_regular.typeface.json', loadedFont => {
            font = loadedFont;
            updateVisual(); // Initialize visual once font is loaded
        });

        // Stack and visualization
        const stack = new Stack();
        const stackObjects = [];
        const maxStackHeight = 10; // Maximum number of elements to show

        // Materials with different colors for stack elements
        const getElementMaterial = (index) => {
            // Create a color gradient from red (bottom) to blue (top)
            const hue = (index / maxStackHeight) * 0.6; // 0.6 = blue, 0 = red
            return new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(hue, 0.8, 0.5) });
        };
        
        const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const highlightMaterial = new THREE.MeshLambertMaterial({ color: 0xffff00 });

        // Function to create element text
        function createTextMesh(text, position) {
            if (!font) return null;

            const textGeometry = new TextGeometry(text.toString(), {
                font: font,
                size: 0.5,
                height: 0.1
            });

            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textMesh.position.copy(position);
            textMesh.position.z += 0.6; // Position text in front of the element
            textMesh.position.x -= 0.3; // Center text
            scene.add(textMesh);
            return textMesh;
        }

        // Function to create a stack element
        function createStackElement(value, index) {
            const elementGeometry = new THREE.BoxGeometry(3, 1, 2);
            const elementMaterial = getElementMaterial(index);
            const elementMesh = new THREE.Mesh(elementGeometry, elementMaterial);
            
            // Position elements from bottom to top
            elementMesh.position.y = index * 1.2;
            
            scene.add(elementMesh);
            
            // Create text for element value
            const textMesh = createTextMesh(value, elementMesh.position);
            
            return { 
                elementMesh, 
                textMesh, 
                value 
            };
        }

        // Animation variables
        let animating = false;
        let animationTime = 0;
        const animationDuration = 1.0; // seconds
        let animationTargetY = 0;
        let elementToAnimate = null;
        let operation = ""; // "push", "pop", or "peek"

        // Function to update visual representation
        function updateVisual(animateNewElement = false) {
            // Clear previous visualization
            while (stackObjects.length > 0) {
                const obj = stackObjects.pop();
                scene.remove(obj.elementMesh);
                if (obj.textMesh) scene.remove(obj.textMesh);
            }

            // Create new elements
            for (let i = 0; i < stack.size(); i++) {
                const element = createStackElement(stack.items[i], i);
                stackObjects.push(element);
            }
            
            // Set up animation for new element if needed
            if (animateNewElement && stackObjects.length > 0) {
                const lastElement = stackObjects[stackObjects.length - 1];
                
                if (operation === "push") {
                    // Start animation from above
                    lastElement.elementMesh.position.y = 15;
                    if (lastElement.textMesh) {
                        lastElement.textMesh.position.y = 15;
                    }
                    
                    elementToAnimate = lastElement;
                    animationTargetY = (stack.size() - 1) * 1.2;
                    animating = true;
                    animationTime = 0;
                }
            }
            
            if (operation === "peek" && stack.size() > 0) {
                // Highlight top element
                const topElement = stackObjects[stackObjects.length - 1];
                topElement.elementMesh.material = highlightMaterial;
                
                // Reset after 1 second
                setTimeout(() => {
                    if (stackObjects.length > 0) {
                        topElement.elementMesh.material = getElementMaterial(stack.size() - 1);
                    }
                }, 1000);
            }
            
            // Update info panel
            document.getElementById('stackInfo').textContent = stack.toString();
            document.getElementById('operationInfo').textContent = 
                operation === "push" ? "Pushed: " + stack.peek() :
                operation === "pop" ? "Popped: " + (elementToAnimate ? elementToAnimate.value : "") :
                operation === "peek" ? "Top element: " + stack.peek() : "";
        }

        // Event listeners
        document.getElementById('push').addEventListener('click', () => {
            const value = parseInt(document.getElementById('pushValue').value);
            if (stack.size() < maxStackHeight) {
                stack.push(value);
                operation = "push";
                updateVisual(true);
            } else {
                document.getElementById('operationInfo').textContent = "Stack overflow! Cannot push more elements.";
            }
        });

        document.getElementById('pop').addEventListener('click', () => {
            if (!stack.isEmpty()) {
                operation = "pop";
                
                // Set up animation for popping
                const topElement = stackObjects[stackObjects.length - 1];
                elementToAnimate = topElement;
                animationTargetY = 15; // Move up out of view
                animating = true;
                animationTime = 0;
                
                // Schedule actual removal after animation
                setTimeout(() => {
                    stack.pop();
                    updateVisual();
                }, animationDuration * 1000);
            } else {
                document.getElementById('operationInfo').textContent = "Cannot pop from empty stack!";
            }
        });

        document.getElementById('peek').addEventListener('click', () => {
            operation = "peek";
            updateVisual();
        });

        document.getElementById('reset').addEventListener('click', () => {
            stack.clear();
            operation = "clear";
            updateVisual();
        });

        // Initialize with some elements
        stack.push(10);
        stack.push(20);
        stack.push(30);
        operation = "initialize";

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Handle animations
            if (animating && elementToAnimate) {
                animationTime += 0.016; // Approximate delta time
                
                if (animationTime < animationDuration) {
                    const progress = animationTime / animationDuration;
                    const easedProgress = 1 - Math.pow(1 - progress, 3); // Cubic ease out
                    
                    const currentY = elementToAnimate.elementMesh.position.y;
                    const newY = currentY + (animationTargetY - currentY) * easedProgress;
                    
                    elementToAnimate.elementMesh.position.y = newY;
                    if (elementToAnimate.textMesh) {
                        elementToAnimate.textMesh.position.y = newY;
                    }
                } else {
                    // Animation complete
                    elementToAnimate.elementMesh.position.y = animationTargetY;
                    if (elementToAnimate.textMesh) {
                        elementToAnimate.textMesh.position.y = animationTargetY;
                    }
                    animating = false;
                }
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
